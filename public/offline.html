<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline – Haushalt</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f2;
        --surface: #ffffff;
        --border: #e2e0da;
        --ink: #1c1b19;
        --muted: #6f6c66;
        --accent: #3f6b5a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181a;
          --surface: #1e2124;
          --border: #33383d;
          --ink: #eceae6;
          --muted: #9a9791;
          --accent: #7fbfa4;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 24rem;
      }
      button {
        justify-self: center;
        margin-top: 0.5rem;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink);
        border-radius: 0.75rem;
        padding: 0.65rem 1.25rem;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Keine Verbindung</h1>
    <p>
      Die App braucht kurz Internet, um den aktuellen Stand zu laden. Sobald du wieder online
      bist, geht es weiter.
    </p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </body>
</html>
